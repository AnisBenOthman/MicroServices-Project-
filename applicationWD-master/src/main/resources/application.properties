spring.application.name=productMS
### FeignClient ###
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

#Server configuration
server.servlet.context-path=/productMs
server.port=8082

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/productMs?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.root= INFO
logging.level.tn.esprit.spring.service= INFO
logging.logback.rollingpolicy.max-file-size= 100KB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{60} - %msg %n
logging.pattern.file= %msg %n
logging.file.name=c:/logging/spring_file.log


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Enable Circuit Breaker
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.inventoryService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventoryService.minimumNumberOfCalls=5
